  source: "Tile Handbook"
  context: "Best practices for wet-zone wall prep"
- id: shower-clearance-001
  text: "Building code requires a minimum of 30 inches x 30 inches for shower enclosures."
  tags: [shower, clearance, code]
  source: "International Residential Code (IRC)"
  context: "Shower sizing compliance"
- id: sink-spacing-001
  text: "A double-sink vanity should have at least 36 inches between centers for user comfort."
