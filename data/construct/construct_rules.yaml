  source: "Bath Design Handbook"
  context: "Fixture layout best practices"
- id: gfi-outlets-001
  text: "All bathroom electrical outlets must be GFCI-protected according to NEC 210.8."
  tags: [electrical, safety, NEC]
  source: "National Electrical Code (NEC)"
  context: "Electrical safety regulations"
- id: vent-fan-001
