name: chat example
description: this workflow chat wiht local model

vars:
  rag_data_path: data/construct/construct_rules.yaml
  rag_storage_path: data/construct/
  rag_collection: construct_rules

steps:
  - name: index_rules
    type: rag
    agent: RAGDatabaseBuilderAgent
    collection_name: ${rag_collection}
    storage_path: ${rag_storage_path}
    input:
      source_files:
        - ${rag_data_path}

  - name: retrieve_construction_info_toilet
    type: rag
    agent: RAGQueryAgent
    collection_name: ${rag_collection}
    storage_path: ${rag_storage_path}
    input:
      user_query: "What are the spacing requirements for a toilet?"
      top_k: 3

  - name: retrieve_construction_info_light
    type: rag
    agent: RAGQueryAgent
    collection_name: ${rag_collection}
    storage_path: ${rag_storage_path}
    input:
      user_query: "Tell me about bathroom lights?"
      top_k: 3

