    Build a modern bathroom with 2 sinks, a walk-in shower with a niche and a crystal bifold shower door, a freestanding tub,
    with two smart mirror cabinet over each sink, tiles size 2x4 ft. bathroom Size: 14x8 ft. with Toilet tub style.  Located in Fair Lawn, NJ.
  requeriments_gpt35: workspace/construct/requirements_gpt35
  materials: workspace/construct/materials

