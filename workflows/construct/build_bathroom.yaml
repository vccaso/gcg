  - name: plan_bathroom_project
    type: ai
    agent: ProjectPlannerAgent
    # model: ModelGpt35Turbo
    # model: ModelGpt4Turbo
    # model: ModelGpt5
    model: ModelOllama
    namespace: construct
    input:
      objectives: "Design and construct a modern bathroom with specified fixtures and smart features."
      scope: "Full interior bathroom build including plumbing, electrical, tiling, and fixture installation."
      constraints: "Budget $25,000; completion in 8 weeks; must comply with NJ building codes."
      team: "General contractor, plumber, electrician, tiler, interior designer."
      timeline: "Start: 2025-09-01; End: 2025-10-27"
      deliverables: "Completed bathroom, final inspection approval, as-built documentation."
      context: "${{project_desc}}"
      notes: "Include energy-efficient and water-saving fixtures where possible."
      save_to_file: true
      file_name: "workspace/construct/project_plan_ollama_${address}.txt"







