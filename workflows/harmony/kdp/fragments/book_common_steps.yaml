
steps:
  - name: generate_fist_page
    type: tool
    agent: PdfAgent
    input:
      content: |
        <section>
          <div style="font-family: 'Arial', sans-serif; text-align: center; padding-top: 100px; padding-bottom: 120px;">
            <h1 style="margin-bottom: 40px; font-size: 28pt;">{{ book_title }}</h1>
            <h2 style="margin-bottom: 180px; font-size: 16pt; font-weight: normal; color: #444;">
              {{ book_subtitle }}
            </h2>
            <div style="font-size: 12pt; margin-bottom: 10px;">
              Published by Harmony Health Journals
            </div>
            <div style="font-size: 10pt; color: #666;">
            <b>© 2025 Harmony Health. All rights reserved.</b>
            No part of this publication may be reproduced, distributed, or transmitted in any form or by any means—including photocopying, recording, or other electronic or mechanical methods—without the prior written permission of the publisher, except in the case of brief quotations used in reviews, educational materials, or other non-commercial uses permitted under applicable copyright law.
            </div>
          </div>
        </section>
      page_size: ${page_size}
      save_path: workspace/harmony/kdp
      filename: ${filename}
      add_page_number: False

  - name: generate_inspirational
    type: tool
    agent: PdfAgent
    input:
      content: |
        {{ style }}
        <section>
            <div style="display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; padding: 0 20px;">
              <div>
                <p style="font-size: 20px; font-style: italic;">
                 {{ inspirational_phrase }}
                </p>
                <p style="font-size: 16px; font-weight: bold;">— {{ inspirational_author }}</p>
              </div>
            </div>
        </section>
      page_size: ${page_size}
      save_path: workspace/harmony/kdp
      filename: ${filename}
      mode: append
      add_page_number: False