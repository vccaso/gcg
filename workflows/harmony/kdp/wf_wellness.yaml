              _____________________________________________________<br/>
              _____________________________________________________<br/>
              _____________________________________________________
              </div>
            </div>
          </div>

          <div class="form-block">
            <div class="form-block-header">
              <div class="form-block-cell">Mental Health Goals for Next Month</div>
            </div>
            <div class="form-block-row">
              <div class="form-block-cell">e.g., Journal more often, reduce phone use at night, connect with a friend<br/>
               _____________________________________________________<br/>
               _____________________________________________________<br/>
               _____________________________________________________<br/>
               _____________________________________________________<br/>
               _____________________________________________________<br/>
               _____________________________________________________
              </div>
            </div>
          </div>
        </section>


      page_size: ${page_size}
      save_path: ${save_path}
      filename: ${filename}
      mode: append

  - name: generate_notes
    type: tool
    agent: PdfAgent
    loop:
      var: index
      count: 2
    input:
      content: |
        {{ style }}
        <section>
          <div class="section-tab" style="top: 120mm; background-color: #a9a9aa;"></div>
          <div class="header-row">
            <img src="workspace/harmony/images/logo2.png" alt="Logo">
