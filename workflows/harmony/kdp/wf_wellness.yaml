name: pdf Blood Sugar Tracker notebook
description: this workflow is to create a pdf Sleep Tracker notebook to publish in kdp
  
include_vars: vars/vars.yaml
vars:
  model: ModelOllama
  link_google_font: <link href="https://fonts.googleapis.com/css2?family=Lora&display=swap" rel="stylesheet">
  book_title: "Harmony Health: Daily Wellness Journal"
  book_subtitle: A guided space to track habits, gratitude, self-care, and progress.
  inspirational_phrase: $file:workspace/harmony/kdp/wellness/inspirational.txt
  inspirational_author: Harmony Health
  filename: wellness.pdf
  save_path: workspace/harmony/kdp/wellness
  filepath_keywords: workspace/harmony/kdp/wellness/keywords.txt
  filepath: workspace/harmony/kdp/wellness/inspirational.txt


include:
  - fragments/book_common_steps.yaml

steps:

  - name: generate_description_and_keywords
    type: ai
    agent: ChatAgent
    model: ModelGpt35Turbo
    template_name: harmony_kdp_01
    when: "{{ not os.path.exists(filepath_keywords) }}"
    input:
      question: "The book title is '{{ book_title }}' and the subtitle '{{ book_subtitle }}'."
      save_to_file: true
      file_name: ${filepath_keywords}

  - name: generate_inspirational_phrase
    type: ai
    agent: ChatAgent
    model: ModelGpt35Turbo
    template_name: inspirational_quote
    when: "{{ not os.path.exists(filepath) }}"
    input:
      question: "A book titled '{{ book_title }}' that helps readers find strength during illness"
      save_to_file: true
      file_name: ${filepath}

  - name: generate_index
    type: tool
    agent: PdfAgent
    input:
      content: |
        {{ style }}
        <section>
          <h2>Index</h2>
          <div class="index-entry"><span>How to Use This Book</span><span>4</span></div>
          <div class="index-entry"><span>What's Inside</span><span>5</span></div>
          <div class="index-entry"><span>Filling Out a Daily Log</span><span>6</span></div>
          <div class="index-entry"><span>Using Monthly Summaries</span><span>8</span></div>
          <div class="index-entry"><span>Tips for Getting the Most Out of This Tracker</span><span>10</span></div>
          <div class="index-entry"><span>Daily Log</span><span>11</span></div>
          <div class="index-entry"><span>Monthly Summary</span><span>101</span></div>
          <div class="index-entry"><span>Notes</span><span>113</span></div>
          <div class="index-entry"><span>About the publisher</span><span>115</span></div>
        </section>
      page_size: ${page_size}
      save_path: ${save_path}
      filename: ${filename}
      mode: append
      add_page_number: False

  - name: generate_how_tu_use
    type: tool
    agent: PdfAgent
    input:
      content: |
        {{ style }}
        <section>
          <div class="section-tab"></div>
          <h2 style="margin-top: 80px;">How to Use This Book</h2>
          <p>
            <b>The Harmony Health: Mood & Mental Health Tracker</b> is designed to help you better understand your emotions, recognize triggers, and support your mental and emotional well-being. Whether you're managing stress, building self-awareness, or simply cultivating more balance in your daily life, this journal provides a safe, structured space for reflection and growth.
            <br/><br/>
            Use this book daily to log your mood, energy, emotional patterns, triggers, and self-care actions. You'll also find space to record gratitude, affirmations, and journal notes. At the end of each month, complete the Monthly Summary to reflect on patterns, track your progress, and set goals for your mental wellness journey.
          </p>
        </section>
      page_size: ${page_size}
      save_path: ${save_path}
      filename: ${filename}
      mode: append

  - name: generate_Inside
    type: tool
    agent: PdfAgent
    input:
      content: |
        {{ style }}
        <section>
          <div class="section-tab"></div>
          <h2>What's Inside:</h2>
          <ul>
            <li><b>Daily Mood & Mental Health Logs:</b> 90+ pages to track mood, emotions, triggers, energy levels, and self-care habits<br/></li>
            <li><b>Monthly Summaries:</b> Pages to reflect on emotional patterns, stressors, and self-care effectiveness<br/></li>
            <li><b>Trigger & Emotion Checklists:</b> Identify common influences on your mood and recurring emotional states<br/></li>
            <li><b>Gratitude & Affirmation Prompts:</b> Space to build daily resilience and reinforce positive thought patterns<br/></li>
            <li><b>Notes Section:</b> Extra pages at the end for reflections, journal entries, therapy insights, or mental wellness goals</li>
          </ul>
        </section>
      page_size: ${page_size}
      save_path: ${save_path}
      filename: ${filename}
      mode: append

  - name: generate_filling_daily
    type: tool
    agent: PdfAgent
    input:
      content: |
        {{ style }}
        <section>
          <div class="section-tab"></div>
          <h2>Filling Out a Daily Log</h2>
          <p>
            Each page of the <b>Harmony Health: Mood & Mental Health Tracker</b> is designed to help you better understand your emotional state, thought patterns, and the habits that support (or challenge) your mental well-being. Use this tracker daily, either in the morning to set intentions or in the evening to reflect on your experiences.
          </p>

          <p>Each daily log includes the following fields:</p>
          <ul>
            <li><b>Date:</b> Record the current day for reference and progress tracking.</li>
            <li><b>Mood Check-In:</b> Rate your overall mood on a scale of 1-10 or with emojis that best match how you feel.</li>
            <li><b>Energy Level:</b> Log your energy on a 1-10 scale or note highs and lows throughout the day.</li>
            <li><b>Dominant Emotions:</b> Identify key feelings experienced (e.g., joy, stress, calm, frustration) to spot recurring emotional patterns.</li>
            <li><b>Triggers or Influences:</b> Note any events, habits, or environments that affected your mood (positive or negative).</li>
            <li><b>Self-Care Activities:</b> Track actions that supported your well-being like journaling, exercise, rest, or therapy.</li>
            <li><b>Reflection or Notes:</b> Use this space to write about anything meaningful—wins, struggles, or things you're working through.</li>
            <li><b>Gratitude or Affirmation:</b> Add one short thought of appreciation or a positive statement to carry forward.</li>
          </ul>
          <br/>
          <h2>Tip</h2>
          <p>
            This journal is a safe space—there are no wrong entries. Use it with compassion, and over time, you'll begin to see patterns and insights that can guide your mental health journey. Even small, honest entries can lead to meaningful growth.
          </p>
        </section>    
      page_size: ${page_size}
      save_path: ${save_path}
      filename: ${filename}
      mode: append

  - name: generate_filling_monthly
    type: tool
    agent: PdfAgent
    input:
      content: |
        {{ style }}
        <section>
          <div class="section-tab"></div>
          <h2>Using Monthly Summaries</h2>
          <p>
            The Monthly Summary is your opportunity to reflect on your emotional well-being across the past few weeks. This section helps you identify patterns, track emotional triggers, highlight progress, and define meaningful goals for the next month. Fill it out at the end of each month using insights from your daily logs.
          </p>

          <p>Here's how to use each part of the Monthly Summary:</p>
          <ul>
            <li><b>Month:</b> Write the name of the month you're reviewing (e.g., July 2025).</li>
            <li><b>Number of Days Tracked:</b> Count how many daily entries you completed during the month.</li>
            <li><b>Average Mood:</b> Estimate your overall mood level for the month on a scale of 1-10, or choose a word that best summarizes how you felt most of the time.</li>
            <li><b>Average Energy Level:</b> Use your daily entries to calculate a general sense of your energy over the month.</li>
            <li><b>Most Common Emotions:</b> List 2-3 feelings that came up the most often (positive or negative).</li>
            <li><b>Frequent Triggers or Stressors:</b> Reflect on what commonly affected your mood — like work stress, sleep issues, screen time, or lack of routine.</li>
            <li><b>Self-Care Habits That Helped:</b> Write down the strategies that helped improve your emotional state (e.g., journaling, therapy, time in nature).</li>
            <li><b>Key Insights or Observations:</b> Think about what stood out this month — maybe your mood improved on weekends, or certain triggers repeated. This is a space for free reflection.</li>
            <li><b>Mental Health Goals for Next Month:</b> Set 1-3 small, supportive goals that you feel ready to try, such as “go to bed earlier,” “talk to a friend weekly,” or “track my mood daily.”</li>
          </ul>

          <h2>Tip</h2>
          <p>
            This summary isn't about judgment — it's about growth. Even difficult months can teach you something valuable. Be kind to yourself and use what you discover to take one small step forward next month.
          </p>
        </section>

      page_size: ${page_size}
      save_path: ${save_path}
      filename: ${filename}
      mode: append


  - name: generate_tips
    type: tool
    agent: PdfAgent
    input:
      content: |
        {{ style }}
        <section>
          <div class="section-tab"></div>
          <h2>Tips for Getting the Most Out of This Tracker</h2>
          <ul>
            <li><b>Be consistent</b> — even a few days a week of tracking can reveal emotional patterns and improve self-awareness.</li>
            <li><b>Write honestly and without judgment</b> — this journal is for you, so don't be afraid to note both highs and lows.</li>
            <li><b>Use symbols or color coding</b> — for example: 💬 for talking to a friend, 🧘 for meditation, 🌧️ for low mood, 🌞 for good energy.</li>
            <li><b>Look for trends</b> — your monthly summary will help you connect the dots between triggers, emotions, and energy levels.</li>
            <li><b>Pair logging with a calming ritual</b> — such as journaling before bed, during morning coffee, or after therapy.</li>
            <li><b>Don't aim for perfection</b> — the goal is progress and awareness, not flawless entries every day.</li>
            <li><b>Celebrate your growth</b> — noting positive shifts, coping strategies, or even one better day can build confidence and motivation.</li>
          </ul>
        </section>
      page_size: ${page_size}
      save_path: ${save_path}
      filename: ${filename}
      mode: append

  - name: generate_dayly_logs
    type: tool
    agent: PdfAgent
    loop:
      var: index
      count: 1
    input:
      content: |
        {{ style }}
          <section>
            <div class="section-tab" style="top: 60mm; background-color: #aaa9a9;"></div>
            <div class="header-row">
              <img src="workspace/harmony/images/logo2.png" alt="Logo">
              <div>Daily Log <span class="highlight-number">{{ index }}</span></div>
            </div>

            <div class="form-block">
              <div class="form-block-header">
                <div class="form-block-cell">Date</div>
                <div class="form-block-cell">Mood (1-10 or emoji)</div>
                <div class="form-block-cell">Energy Level</div>
              </div>
              <div class="form-block-row">
                <div class="form-block-cell">&nbsp;</div>
                <div class="form-block-cell" style="font-size:14pt;">😊 😐 😢 😠 😴</div>
                <div class="form-block-cell">1-10</div>
              </div>
            </div>

            <div class="form-block">
              <div class="form-block-header">
                <div class="form-block-cell">Dominant Emotions</div>
                <div class="form-block-cell">Triggers or Influences</div>
              </div>
              <div class="form-block-row">
                <div class="form-block-cell">Joy, Calm, Stress, Sadness, Anxiety, Frustration, Gratitude, etc.</div>
                <div class="form-block-cell">Work, Sleep, Food, Relationships, Social Media, Environment, Unknown</div>
              </div>
            </div>

            <div class="form-block">
              <div class="form-block-header">
                <div class="form-block-cell">Activities</div>
              </div>
              <div class="form-block-row">
                <div class="form-block-cell">
                  <span>[ ] Journaling </span>
                  <span>[ ] Meditation </span>
                  <span>[ ] Exercise </span>
                  <span>[ ] Creative outlet </span>
                  <span>[ ] Alone time </span>
                  <span>[ ] Social support</span>
                </div>
              </div>
            </div>

            <div class="form-block">
              <div class="form-block-header">
                <div class="form-block-cell">Gratitude or Affirmation</div>
              </div>
              <div class="form-block-row">
                <div class="form-block-cell">Today I'm grateful for...<br/>
                _____________________________________________________<br/>
                _____________________________________________________<br/>
                A thought I want to carry into tomorrow is...
                _____________________________________________________<br/>
                _____________________________________________________</div>
              </div>
            </div>
            <div class="form-block">
              <div class="form-block-header">
                <div class="form-block-cell">Reflection / Notes</div>
              </div>
              <div class="form-block-row">
                <div class="form-block-cell">_____________________________________________________<br/>
                _____________________________________________________<br/>
                _____________________________________________________<br/>
                _____________________________________________________<br/>
                _____________________________________________________<br/>
                _____________________________________________________</div>
              </div>
            </div>
          </section>

      page_size: ${page_size}
      save_path: ${save_path}
      filename: ${filename}
      mode: append

  - name: generate_monthly_summaries
    type: tool
    agent: PdfAgent
    loop:
      var: index
      count: 1
    input:
      content: |
        {{ style }}
        <section>
          <div class="section-tab" style="top: 90mm; background-color: #aaa9a9;"></div>
          <div class="header-row">
            <img src="workspace/harmony/images/logo2.png" alt="Logo">
            <div>Monthly Summary <span class="highlight-number">{{ index }}</span></div>
          </div>

          <div class="form-block">
            <div class="form-block-header">
              <div class="form-block-cell">Month</div>
              <div class="form-block-cell"># of Days Tracked</div>
              <div class="form-block-cell">Average Mood (1-10)</div>
            </div>
            <div class="form-block-row">
              <div class="form-block-cell">&nbsp;</div>
              <div class="form-block-cell">&nbsp;</div>
              <div class="form-block-cell">&nbsp;</div>
            </div>
          </div>

          <div class="form-block">
            <div class="form-block-header">
              <div class="form-block-cell">Average Energy Level</div>
              <div class="form-block-cell">Most Common Emotions</div>
            </div>
            <div class="form-block-row">
              <div class="form-block-cell">1-10</div>
              <div class="form-block-cell">e.g., calm, anxious, grateful</div>
            </div>
